<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#0F1724"/>
    </linearGradient>
    <radialGradient id="amber-glow" cx="50%" cy="42%" r="30%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow" cx="30%" cy="35%" r="20%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple-glow" cx="70%" cy="35%" r="20%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-shadow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#amber-glow)"/>
  <rect width="1280" height="320" fill="url(#blue-glow)"/>
  <rect width="1280" height="320" fill="url(#purple-glow)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#1F2937" opacity="0.6"/>
  </pattern>
  <rect width="1280" height="320" fill="url(#dots)"/>

  <!-- ── SYSMON EYE (left) ─────────────────────────────────── -->
  <g transform="translate(340,105)">
    <!-- outer shimmer ring -->
    <path d="M -52,0 Q 0,-28 52,0 Q 0,28 -52,0 Z" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.2"/>
    <!-- eye white -->
    <path d="M -44,0 Q 0,-24 44,0 Q 0,24 -44,0 Z" fill="#0B1929" stroke="#38BDF8" stroke-width="1.4"/>
    <!-- iris -->
    <circle cx="0" cy="0" r="12" fill="#0369A1"/>
    <!-- pupil -->
    <circle cx="0" cy="0" r="5.5" fill="#E0F2FE"/>
    <!-- specular -->
    <circle cx="3" cy="-4" r="2" fill="white" opacity="0.6"/>
    <!-- label -->
    <text y="42" text-anchor="middle" fill="#7DD3FC" font-size="10.5" font-family="ui-monospace,monospace" letter-spacing="2" opacity="0.85">SYSMON</text>
  </g>

  <!-- ── KERNEL DRIVER EYE (center — the Third Eye) ────────── -->
  <g transform="translate(640,98)" filter="url(#soft-glow)">
    <!-- outer amber halo -->
    <path d="M -64,0 Q 0,-36 64,0 Q 0,36 -64,0 Z" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.18"/>
    <path d="M -56,0 Q 0,-32 56,0 Q 0,32 -56,0 Z" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.3"/>
    <!-- eye white -->
    <path d="M -48,0 Q 0,-28 48,0 Q 0,28 -48,0 Z" fill="#150E00" stroke="#F59E0B" stroke-width="2"/>
    <!-- iris -->
    <circle cx="0" cy="0" r="15" fill="#B45309"/>
    <!-- pupil -->
    <circle cx="0" cy="0" r="7" fill="#FEF3C7"/>
    <!-- specular -->
    <circle cx="4" cy="-5" r="2.5" fill="white" opacity="0.7"/>
    <!-- vertical bindi mark above (Shiva's third eye) -->
    <line x1="0" y1="-15" x2="0" y2="-28" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="-31" r="2" fill="#F59E0B" opacity="0.6"/>
    <!-- label -->
    <text y="48" text-anchor="middle" fill="#FCD34D" font-size="10.5" font-family="ui-monospace,monospace" letter-spacing="2" opacity="0.9">KERNEL DRIVER</text>
  </g>

  <!-- ── ETW EYE (right) ────────────────────────────────────── -->
  <g transform="translate(940,105)">
    <!-- outer shimmer ring -->
    <path d="M -52,0 Q 0,-28 52,0 Q 0,28 -52,0 Z" fill="none" stroke="#A78BFA" stroke-width="0.8" opacity="0.2"/>
    <!-- eye white -->
    <path d="M -44,0 Q 0,-24 44,0 Q 0,24 -44,0 Z" fill="#110B1F" stroke="#A78BFA" stroke-width="1.4"/>
    <!-- iris -->
    <circle cx="0" cy="0" r="12" fill="#6D28D9"/>
    <!-- pupil -->
    <circle cx="0" cy="0" r="5.5" fill="#EDE9FE"/>
    <!-- specular -->
    <circle cx="3" cy="-4" r="2" fill="white" opacity="0.6"/>
    <!-- label -->
    <text y="42" text-anchor="middle" fill="#C4B5FD" font-size="10.5" font-family="ui-monospace,monospace" letter-spacing="2" opacity="0.85">ETW</text>
  </g>

  <!-- ── Fusion lines (sensors → core) ────────────────────── -->
  <line x1="384" y1="105" x2="592" y2="98" stroke="#38BDF8" stroke-width="1" stroke-dasharray="5,5" opacity="0.22"/>
  <line x1="896" y1="105" x2="688" y2="98" stroke="#A78BFA" stroke-width="1" stroke-dasharray="5,5" opacity="0.22"/>

  <!-- ── TRINETRA text ──────────────────────────────────────── -->
  <!-- shadow layer -->
  <text x="640" y="224" text-anchor="middle"
        fill="#F59E0B" opacity="0.12"
        font-size="74" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif"
        font-weight="800" letter-spacing="14">TRINETRA</text>
  <!-- main text -->
  <text x="640" y="222" text-anchor="middle"
        fill="#F9FAFB"
        font-size="74" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif"
        font-weight="800" letter-spacing="14">TRINETRA</text>

  <!-- ── Sanskrit + category line ──────────────────────────── -->
  <text x="640" y="260" text-anchor="middle"
        fill="#6B7280"
        font-size="13.5" font-family="ui-sans-serif,system-ui,sans-serif"
        letter-spacing="5">&#x924;&#x94D;&#x930;&#x093F;&#x928;&#x947;&#x924;&#x94D;&#x930;  &#xB7;  THE THREE-EYED  &#xB7;  WINDOWS EDR</text>

  <!-- ── Tagline ────────────────────────────────────────────── -->
  <text x="640" y="295" text-anchor="middle"
        fill="#374151"
        font-size="11" font-family="ui-monospace,monospace"
        letter-spacing="3">THREE SENSORS  ·  ONE TRUTH</text>

  <!-- ── Thin border ────────────────────────────────────────── -->
  <rect x="1" y="1" width="1278" height="318" fill="none" stroke="#1F2937" stroke-width="1.5" rx="2"/>
</svg>
