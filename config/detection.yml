# Detection tunables for the EDR prototype. Anything left out here falls
# back to the hardcoded default in src/detection_config.py - deleting this
# file entirely is safe and changes nothing.
#
# NOT configurable here, on purpose: the protected-process safety floor,
# LSASS/hollowing access-mask bitmasks, and Defender-tamper/PowerShell-abuse
# pattern lists. Those stay hardcoded in src/heuristic_engine.py so a bad or
# malicious edit to this file can never loosen the one thing that must never
# move - see README's "Safety model" section.

decay_points_per_second: 0.3333  # ~20 points/minute

thresholds:
  warning: 50
  critical: 80

ransomware:
  file_event_window_seconds: 20
  file_event_threshold: 60

# How long process_correlator.py waits for a same-pid ETW+Sysmon pair to
# fuse before dispatching whatever arrived alone. Provisional default, not
# yet measured against real Sysmon-vs-ETW delivery lag on a live system.
correlator:
  fuse_window_seconds: 2.0
  # Log [SENSOR-BLINDSPOT] when the kernel driver and ETW disagree about
  # whether a process was created (one saw it, the other never reported it
  # within witness_window_seconds). Warning-only: never scores or kills.
  witness_check: true
  witness_window_seconds: 5.0
  # Score a mismatch between the ETW event header's creating pid and the
  # claimed parent as PPID spoofing. Leave false until /api/summary's
  # witness.creator_agreement shows `agree` ~= everything and `disagree` ~= 0
  # on this host - a spoof verdict can auto-terminate a process.
  etw_creator_scoring: false

# How often self_test.py's benign process-visibility/alert-pipeline check
# runs, and how long it waits for each check to succeed before failing
# loudly.
self_test:
  interval_seconds: 300
  timeout_seconds: 15
