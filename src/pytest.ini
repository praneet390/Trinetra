[pytest]
# Without this, pytest's own logging plugin raises the root logger's
# effective level (observed: WARNING -> ERROR) whenever no log_level is
# configured - silently dropping every logging.warning()/logging.info()
# call this project's detection code makes to report findings, before it
# ever reaches a test's log-capture handler. Under the plain interpreter
# (`python test_x.py`, this project's documented way to run tests) the
# root logger stays at its real default (WARNING), so the same assertions
# pass there but fail under bare `pytest` - not a logic bug, a missing
# pytest/logging-plugin config. Setting this to WARNING here makes `pytest`
# and `python test_x.py` agree on what a test can observe being logged.
log_level = WARNING
